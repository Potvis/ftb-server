services:
  minecraft:
    build:
      context: .
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
    image: ${MINECRAFT_IMAGE:-pvmjay/ftb-server:latest}
    container_name: ${CONTAINER_NAME:-minecraft-server}
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${DOWNLOADS_DIR:-./downloads}:/downloads:ro
    environment:
      EULA: "${EULA:-TRUE}"

      # Select AUTO_CURSEFORGE or FTBA. The unused platform variables are ignored.
      MODPACK_PLATFORM: ${MODPACK_PLATFORM:-AUTO_CURSEFORGE}

      # CurseForge settings. Defaults install the latest All the Mods 10 release.
      CF_SLUG: ${CF_SLUG:-all-the-mods-10}
      CF_FILE_ID: ${CF_FILE_ID:-}
      CF_FILENAME_MATCHER: ${CF_FILENAME_MATCHER:-}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_IGNORE_MISSING_FILES: |
        config/ftbquests/quests/reward_tables/*.snbt
      CF_OVERRIDES_EXCLUSIONS: |
        shaderpacks/**

      # Feed The Beast settings. Set MODPACK_PLATFORM=FTBA to use these.
      FTB_MODPACK_ID: ${FTB_MODPACK_ID:-}
      FTB_MODPACK_VERSION_ID: ${FTB_MODPACK_VERSION_ID:-}

      # Runtime settings.
      INIT_MEMORY: ${INIT_MEMORY:-4G}
      MAX_MEMORY: ${MAX_MEMORY:-12G}
      USE_MEOWICE_FLAGS: "${USE_MEOWICE_FLAGS:-true}"
      UID: ${MC_UID:-1000}
      GID: ${MC_GID:-1000}
      TZ: ${TZ:-Europe/Brussels}

      # RCON is only reachable inside this Compose network.
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in .env}
    stdin_open: true
    tty: true
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-14g}
    mem_reservation: ${CONTAINER_MEMORY_RESERVATION:-12g}

  rcon-web:
    image: itzg/rcon:latest
    container_name: ${RCON_CONTAINER_NAME:-minecraft-rcon-web}
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      RWA_USERNAME: ${RWA_USERNAME:-admin}
      RWA_PASSWORD: ${RWA_PASSWORD:?Set RWA_PASSWORD in .env}
      RWA_ADMIN: "TRUE"
      RWA_RCON_HOST: minecraft
      RWA_RCON_PORT: 25575
      RWA_RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in .env}
    ports:
      - "${RCON_WEB_BIND:-127.0.0.1}:${RCON_WEB_PORT:-4326}:4326"
      - "${RCON_WEB_BIND:-127.0.0.1}:${RCON_WEBSOCKET_PORT:-4327}:4327"
    volumes:
      - rcon-data:/opt/rcon-web-admin/db

volumes:
  rcon-data:
